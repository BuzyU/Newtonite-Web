services:
  - type: web
    name: newtonite-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
